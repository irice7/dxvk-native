# Simply fill in the constants
[constants]
ndk = '<path to ndk (ANDROID_NDK_HOME)>'
sdl_prefix = '<path to sdl install prefix/path>'
toolchain = ndk + '/' + 'toolchains/llvm/prebuilt/<platform>/bin'
target = 'aarch64-linux-android33'

[binaries]
c     = toolchain + '/' + target + '-clang.cmd'
cpp   = toolchain + '/' + target + '-clang++.cmd'
ar    = toolchain + '/' + 'llvm-ar'
strip = toolchain + '/' + 'llvm-strip'

[built-in options]
cpp_args = ['-I' + sdl_prefix + '/include/SDL2']
c_args = ['-I' + sdl_prefix + '/include/SDL2']
cpp_link_args = ['-L' + sdl_prefix + '/lib']
c_link_args = ['-L' + sdl_prefix + '/lib']

[host_machine]
system = 'android'
kernel = 'linux'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'
